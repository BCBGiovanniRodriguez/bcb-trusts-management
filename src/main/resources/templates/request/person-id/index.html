<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
    <head th:replace="~{fragments/common :: head}"></head>

    <body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
        <div class="app-wrapper">
            <nav th:replace="~{fragments/common :: nav}"></nav>

            <aside th:replace="~{fragments/common :: aside}"></aside>

            <main class="app-main">
                <div class="app-content-header">
                    <div class="container-fluid">
                        <div class="row">
                            <div class="col-12">
                                <h4>ID Persona Única</h4>
                                <hr>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="app-content">
                    <div class="container-fluid">
                        <div class="row">
                            <div class="col-12">
                                <div class="card card-outline card-info mb-4">
                                    <div class="card-header">
                                        <h3 class="card-title"><strong>Buscar Personas</strong></h3>
                                    </div>
                                    <div class="card-body">
                                        <div class="row mb-3">
                                            <label for="personName" class="col-md-2 col-form-label"><strong>Nombre de la Persona</strong></label>
                                            <div class="col-md-4">
                                                <input type="text" class="form-control" id="name" placeholder="Ingrese el nombre de la persona">
                                            </div>
                                            <label for="personRfc" class="col-md-2 col-form-label"><strong>RFC</strong></label>
                                            <div class="col-md-4">
                                                <input type="text" class="form-control" id="rfc" placeholder="Ingrese el RFC de la persona">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-12">
                                <div class="card card-outline card-primary mb-4">
                                    <div class="card-header">
                                        <h3 class="card-title"><strong>ID Personas Encontradas</strong></h3>
                                    </div>
                                    <div class="card-body">
                                        <div class="table-responsive">
                                            <table class="table table-striped table-bordered table-hover" id="requestTable">
                                                <thead>
                                                    <tr>
                                                        <th>#</th>
                                                        <th>Nombre Persona</th>
                                                        <th>Registrado en</th>
                                                        <th>Miembro del Negocio</th>
                                                        <th>Fecha de Registro</th>
                                                    </tr>
                                                </thead>
                                                <tbody th:each="request : ${requestList}">
                                                    <tr>
                                                        <td th:text="${request.requestId}"></td>
                                                        <td th:text="${request.number}"></td>
                                                        <td th:text="${request.trustTypeEntity.name}"></td>
                                                        <td th:text="${request.personEntity.rfc}"></td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                                
                            </div>
                        </div>
                    </div>
                </div>
            </main>

            <footer th:replace="~{fragments/common :: footer}"></footer>

            <div th:replace="~{fragments/common :: commonModals}"></div>

            <div th:replace="~{fragments/common :: jsDependencies}"></div>
        </div>
    </body>
</html>
