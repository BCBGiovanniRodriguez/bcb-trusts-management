databaseChangeLog:
  - changeSet:
      id: 18
      author: grodriguez@bcbcasadebolsa.com
      context: user
      labels: InitialSetup
      comments: Create table request_catalog_business_members
      changes:
        - tagDatabase:
            tag: saf-0.0.1

        - createTable:
            tableName: request_catalog_business_members
            columns:
              - column: { name: business_member_id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true }, remarks: "Identificador único para cada miembro del negocio" }
              - column: { name: code, type: VARCHAR(15), constraints: { nullable: false }, remarks: "Código único para cada miembro del negocio" }
              - column: { name: name, type: VARCHAR(255), constraints: { nullable: false }, remarks: "Nombre del miembro del negocio" }
              - column: { name: description, type: VARCHAR(1024), constraints: { nullable: true }, remarks: "Descripción del miembro del negocio" }
              - column: { name: status, type: TINYINT, defaultValue: 1, constraints: { nullable: false }, remarks: "Habilitado = 1, Deshabilitado = 2" }
              - column: { name: created_at, type: DATETIME, defaultValueComputed: "CURRENT_TIMESTAMP", constraints: { nullable: false } }