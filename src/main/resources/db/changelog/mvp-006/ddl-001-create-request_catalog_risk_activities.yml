databaseChangeLog:
  - changeSet:
      id: 24
      author: grodriguez@bcbcasadebolsa.com
      context: user
      labels: InitialSetup
      comments: Create table request_catalog_risk_activities
      changes:
        - tagDatabase:
            tag: saf-0.0.1

        - createTable:
            tableName: request_catalog_risk_activities
            columns:
              - column: { name: risk_activity_id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true }, remarks: "Identificador único para la actividad de riesgo" }
              - column: { name: name, type: VARCHAR(255), constraints: { nullable: false }, remarks: "Nombre de la actividad de riesgo" }
              - column: { name: status, type: TINYINT, defaultValue: 1, constraints: { nullable: false }, remarks: "Habilitado = 1, Deshabilitado = 2" }
              - column: { name: created_at, type: DATETIME, defaultValueComputed: "CURRENT_TIMESTAMP", constraints: { nullable: false } }