databaseChangeLog:
  - changeSet:
      id: 29
      author: grodriguez@bcbcasadebolsa.com
      context: user
      labels: InitialSetup
      comments: Create table request_unique_person_membership
      changes:
        - tagDatabase:
            tag: saf-0.0.1

        - createTable:
            tableName: request_unique_person_membership
            columns:
              - column: { name: unique_person_membership_id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true }, remarks: "Identificador único para la membresía de la persona única" }
              - column: { name: unique_person_id, type: BIGINT, constraints: { nullable: true }, remarks: "Identificador único para la persona única" }
              - column: { name: type, type: TINYINT, constraints: { nullable: false }, remarks: "Identificador de la solicitud" }
              - column: { name: business_member_id, type: BIGINT, constraints: { nullable: false }, remarks: "Identificador del miembro del negocio" }
              - column: { name: rc_number, type: BIGINT, constraints: { nullable: false }, remarks: "Identificador de solicitud/contrato" }
              - column: { name: created_at, type: DATETIME, defaultValueComputed: "CURRENT_TIMESTAMP", constraints: { nullable: false } }

        - addForeignKeyConstraint:
            baseTableName: request_unique_person_membership
            baseColumnNames: unique_person_id
            referencedTableName: request_unique_persons
            referencedColumnNames: unique_person_id
            constraintName: request_unique_person_membership_fk_1

        - addForeignKeyConstraint:
            baseTableName: request_unique_person_membership
            baseColumnNames: business_member_id
            referencedTableName: request_catalog_business_members
            referencedColumnNames: business_member_id
            constraintName: request_unique_person_membership_fk_2
