databaseChangeLog:
  - changeSet:
      id: 28
      author: grodriguez@bcbcasadebolsa.com
      context: user
      labels: InitialSetup
      comments: Create table request_unique_persons
      changes:
        - tagDatabase:
            tag: saf-0.0.1

        - createTable:
            tableName: request_unique_persons
            columns:
              - column: { name: unique_person_id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true }, remarks: "Identificador único para la persona única" }
              - column: { name: person_id, type: BIGINT, constraints: { nullable: false }, remarks: "Identificador de la persona" }
              - column: { name: created_at, type: DATETIME, defaultValueComputed: "CURRENT_TIMESTAMP", constraints: { nullable: false } }

        - addForeignKeyConstraint:
            baseTableName: request_unique_persons
            baseColumnNames: person_id
            referencedTableName: system_catalog_persons
            referencedColumnNames: person_id
            constraintName: request_unique_persons_fk_1
