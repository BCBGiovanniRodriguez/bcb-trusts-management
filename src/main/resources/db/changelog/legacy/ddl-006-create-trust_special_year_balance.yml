databaseChangeLog:
  - changeSet:
      id: 35
      author: grodriguez@bcbcasadebolsa.com
      context: user
      labels: InitialSetup
      comments: Create table trust_special_worker_year_balance
      changes:
        - tagDatabase:
            tag: saf-0.0.1
        - createTable:
            tableName: trust_special_worker_year_balance
            columns:
              - column: { name: year_balance_id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true } }
              - column: { name: worker_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: year_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: worker_deposits, type: 'NUMERIC(19, 4)', constraints: { nullable: true } }
              - column: { name: worker_interest, type: 'NUMERIC(19, 4)', constraints: { nullable: true } }
              - column: { name: township_deposits, type: 'NUMERIC(19, 4)', constraints: { nullable: true } }
              - column: { name: township_interest, type: 'NUMERIC(19, 4)', constraints: { nullable: true } }
              - column: { name: negative_worker_interest, type: 'NUMERIC(19, 4)', constraints: { nullable: true } }
              - column: { name: negative_township_interest, type: 'NUMERIC(19, 4)', constraints: { nullable: true } }
              - column: { name: worker_withdraw, type: 'NUMERIC(19, 4)', constraints: { nullable: true } }
              - column: { name: township_withdraw, type: 'NUMERIC(19, 4)', constraints: { nullable: true } }
              - column: { name: worker_transfer, type: 'NUMERIC(19, 4)', constraints: { nullable: true } }
              - column: { name: township_transfer, type: 'NUMERIC(19, 4)', constraints: { nullable: true } }
              - column: { name: balance, type: 'NUMERIC(19, 4)', constraints: { nullable: true } }

        - addForeignKeyConstraint:
            baseTableName: trust_special_worker_year_balance
            baseColumnNames: worker_id
            referencedTableName: trust_special_workers
            referencedColumnNames: worker_id
            constraintName: trust_special_worker_year_balance_fk_1

        - addForeignKeyConstraint:
            baseTableName: trust_special_worker_year_balance
            baseColumnNames: year_id
            referencedTableName: trust_special_years
            referencedColumnNames: year_id
            constraintName: trust_special_worker_year_balance_fk_2