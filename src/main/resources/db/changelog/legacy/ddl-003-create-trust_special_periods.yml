databaseChangeLog:
  - changeSet:
      id: 32
      author: grodriguez@bcbcasadebolsa.com
      context: user
      labels: InitialSetup
      comments: Create table trust_special_periods
      changes:
        - tagDatabase:
            tag: saf-0.0.1
        - createTable:
            tableName: trust_special_periods
            columns:
              - column: { name: period_id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true } }
              - column: { name: trust_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: year_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: trust_number, type: INTEGER, constraints: { nullable: false } }
              - column: { name: start_date, type: DATE, constraints: { nullable: false } }
              - column: { name: end_date, type: DATE, constraints: { nullable: false } }

        - addForeignKeyConstraint:
            baseTableName: trust_special_periods
            baseColumnNames: trust_id
            referencedTableName: trust_catalog_trusts
            referencedColumnNames: trust_id
            constraintName: trust_special_periods_fk_1

        - addForeignKeyConstraint:
            baseTableName: trust_special_periods
            baseColumnNames: year_id
            referencedTableName: trust_special_years
            referencedColumnNames: year_id
            constraintName: trust_special_periods_fk_2
