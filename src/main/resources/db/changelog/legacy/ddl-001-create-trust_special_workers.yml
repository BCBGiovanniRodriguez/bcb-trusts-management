databaseChangeLog:
  - changeSet:
      id: 30
      author: grodriguez@bcbcasadebolsa.com
      context: user
      labels: InitialSetup
      comments: Create table trust_special_workers
      changes:
        - tagDatabase:
            tag: saf-0.0.1
        - createTable:
            tableName: trust_special_workers
            columns:
              - column: { name: worker_id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true } }
              - column: { name: trust_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: number, type: INTEGER, constraints: { nullable: false } }
              - column: { name: name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: department, type: VARCHAR(200), constraints: { nullable: false } }
              - column: { name: account, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: status, type: TINYINT, constraints: { nullable: false } }
              - column: { name: start_work_date, type: DATE, constraints: { nullable: false } }
              - column: { name: end_work_date, type: DATE, constraints: { nullable: true } }
              - column: { name: last_modified_date, type: DATE, constraints: { nullable: false } }
              - column: { name: created_at, type: DATETIME, constraints: { nullable: false } }

        - addForeignKeyConstraint:
            baseTableName: trust_special_workers
            baseColumnNames: trust_id
            referencedTableName: trust_catalog_trusts
            referencedColumnNames: trust_id
            constraintName: trust_special_workers_fk_1
