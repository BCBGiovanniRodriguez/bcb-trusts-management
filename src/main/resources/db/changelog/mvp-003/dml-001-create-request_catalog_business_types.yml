databaseChangeLog:
  - changeSet:
      id: 16
      author: grodriguez@bcbcasadebolsa.com
      context: user
      labels: InitialSetup
      comments: Create table request_catalog_business_types
      changes:
        - tagDatabase:
            tag: saf-0.0.1
        - createTable:
            tableName: request_catalog_business_types
            columns:
              - column: { name: business_type_id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true } }
              - column: { name: name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: status, type: TINYINT, defaultValue: 1, constraints: { nullable: false }, remarks: "Habilitado = 1, Deshabilitado = 2" }
              - column: { name: created_at, type: DATETIME, defaultValueComputed: "CURRENT_TIMESTAMP", constraints: { nullable: false } }
