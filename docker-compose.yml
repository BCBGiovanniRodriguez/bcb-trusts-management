services:
  db:
    image: mysql:latest
    ports:
      - 53306:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USERNAME}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - network_trust
  app:
    build: .
    ports:
      - 10101:10101
    environment:
      DATABASE_JDBC_URL: ${DATABASE_JDBC_URL}
      DATABASE_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_DRIVER_CLASSNAME: ${DATABASE_DRIVER_CLASSNAME}
      DATABASE_PLATFORM: ${DATABASE_PLATFORM}
      LEGACY_DB_JDBC_URL: ${LEGACY_DB_JDBC_URL}
      LEGACY_DB_USERNAME: ${LEGACY_DB_USERNAME}
      LEGACY_DB_PASSWORD: ${LEGACY_DB_PASSWORD}
      LEGACY_DB_DRIVER_CLASSNAME: ${LEGACY_DB_DRIVER_CLASSNAME}
      LEGACY_HIBERNATE_DIALECT: ${LEGACY_HIBERNATE_DIALECT}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src/main/resources:/app/src/main/resources
      - ./trusts:/app/trusts
    networks:
      - network_trust

volumes:
  db-data: 

networks:
  network_trust:
